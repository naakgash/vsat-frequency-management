name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only credentials for a throwaway service container. Real secrets never appear
  # in this file (specification section 21.8).
  DJANGO_SECRET_KEY: ci-only-key-not-used-in-any-real-environment
  POSTGRES_DB: vsat_dev
  POSTGRES_USER: vsat
  POSTGRES_PASSWORD: vsat_ci
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  quality:
    name: Static quality gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lock file
        run: uv sync --frozen --python 3.12

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy config operations audit accounts specifications inventory beams calculations spectrum satnets

      - name: Module dependency direction
        run: uv run lint-imports

  test:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-24.04

    services:
      postgres:
        # The version the production target runs. The suite depends on exclusion
        # constraints, int8range and btree_gist, so there is no SQLite alternative.
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: vsat_dev
          POSTGRES_USER: vsat
          POSTGRES_PASSWORD: vsat_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vsat -d vsat_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The terminology and language guard rails enumerate files through git.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies from the lock file
        run: uv sync --frozen --python 3.12

      - name: Run tests
        run: uv run pytest -v

      - name: Verify migrations are complete and consistent
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  security:
    name: Dependency and image scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies from the lock file
        run: uv sync --frozen --python 3.12

      - name: Audit dependencies for known vulnerabilities
        run: uvx pip-audit --strict --progress-spinner off

      - name: Build the application image
        run: docker build -f docker/Dockerfile -t vsat-spectrum:ci .

      # Trivy is run from its own published image rather than through the marketplace
      # action. `aquasecurity/trivy-action@0.28.0` stopped resolving — "unable to find
      # version" — which fails the job before the scanner is ever reached, and a security
      # gate that breaks when a third party retags is not a gate. Running the image keeps
      # the version under our control, in a file we can verify, and removes one more
      # third-party action from a pipeline that holds a repository token.
      #
      # Bumping the scanner is a one-line change to TRIVY_VERSION. The vulnerability
      # database is fetched at run time and is independent of it, so an older scanner
      # still reports today's CVEs; the version governs the analysers, not the findings.

      # That database is pulled from ghcr.io, which rate-limits anonymous requests.
      # GitHub-hosted runners share source addresses, so an uncached job can fail on
      # someone else's traffic. Caching it makes the scan depend on our own code rather
      # than on the day's luck.
      - name: Cache the Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Scan the image
        env:
          TRIVY_VERSION: "0.73.0"
        run: |
          # The cache directory must exist before it is mounted, or Docker creates it
          # root-owned and actions/cache cannot read it back on the next run.
          mkdir -p "${HOME}/.cache/trivy"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            "aquasec/trivy:${TRIVY_VERSION}" image \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            vsat-spectrum:ci
