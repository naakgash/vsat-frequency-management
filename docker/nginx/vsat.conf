# Production nginx configuration.
#
# Specification section 22.2: only 443 is publicly exposed, 80 redirects, PostgreSQL
# stays internal. TLS certificates are mounted from the host; they are never baked into
# an image and never committed.

upstream vsat_app {
    server web:8000 fail_timeout=0;
}

# Rate limits (§21). Two zones, because the two things being protected are different.
#
# `signin` guards credential stuffing. It is deliberately tighter than anything else and it is
# the second line, not the first: accounts/services.py already throttles and locks out per
# account (S2). This one bounds the attempt rate per *source*, which an account-scoped
# throttle cannot — spraying one password across four hundred usernames never trips it.
limit_req_zone $binary_remote_addr zone=signin:10m rate=12r/m;
# `general` is a burst ceiling on everything else. Set well above what a person generates and
# well below what a script does, so it never fires for a real operator working quickly.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

# 429 rather than nginx's default 503: a client that is being rate limited should be told
# that, and 503 says "the server is broken", which sends people to the wrong place.
limit_req_status 429;
limit_conn_status 429;

# Port 80 exists only to redirect. It serves no application content.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${VSAT_SERVER_NAME};

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS is also set by Django; duplicating it here means it survives a request that
    # never reaches the application.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Import workbooks are the only upload path. Matches DJANGO_MAX_UPLOAD_BYTES so an
    # oversized body is rejected here rather than after occupying a worker.
    client_max_body_size 25m;

    # Do not advertise the nginx version on error pages.
    server_tokens off;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoints are polled frequently and would otherwise dominate the log.
    location = /health/live {
        access_log off;
        proxy_pass http://vsat_app;
    }

    # The sign-in form, held to its own tighter limit. `nodelay` lets a person who mistyped
    # their password retry immediately and still refuses a sustained attempt rate.
    location = /accounts/login/ {
        limit_req zone=signin burst=5 nodelay;
        proxy_pass http://vsat_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # A burst wide enough for a page that fetches several HTMX fragments at once, which is
        # what the Satnet Path wizard does on every keystroke.
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://vsat_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Excel export of a large filtered set can take longer than the default.
        proxy_read_timeout 120s;
    }
}
