# Production nginx configuration.
#
# Specification section 22.2: only 443 is publicly exposed, 80 redirects, PostgreSQL
# stays internal. TLS certificates are mounted from the host; they are never baked into
# an image and never committed.

upstream vsat_app {
    server web:8000 fail_timeout=0;
}

# Port 80 exists only to redirect. It serves no application content.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${VSAT_SERVER_NAME};

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS is also set by Django; duplicating it here means it survives a request that
    # never reaches the application.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Import workbooks are the only upload path. Matches DJANGO_MAX_UPLOAD_BYTES so an
    # oversized body is rejected here rather than after occupying a worker.
    client_max_body_size 25m;

    # Do not advertise the nginx version on error pages.
    server_tokens off;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoints are polled frequently and would otherwise dominate the log.
    location = /health/live {
        access_log off;
        proxy_pass http://vsat_app;
    }

    location / {
        proxy_pass http://vsat_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Excel export of a large filtered set can take longer than the default.
        proxy_read_timeout 120s;
    }
}
