# Local development stack.
#
# Specification section 22.1 requires one command to start Django, PostgreSQL, demo
# users, seed data and health checks. That command is `make up`, which wraps this file.
#
# The production stack differs in three ways and lives in compose.production.yaml:
# nginx terminates TLS in front of Gunicorn, no port is published for PostgreSQL, and
# the application image is built from a tagged release rather than the working tree.

name: vsat-spectrum

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vsat_dev}
      POSTGRES_USER: ${POSTGRES_USER:-vsat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vsat_local_dev}
      # Deterministic collation, so ordering of codes matches production exactly.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Published for local inspection with psql only. The production stack omits this
      # entirely — section 22.2 requires PostgreSQL to stay internal.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vsat} -d ${POSTGRES_DB:-vsat_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      POSTGRES_DB: ${POSTGRES_DB:-vsat_dev}
      POSTGRES_USER: ${POSTGRES_USER:-vsat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vsat_local_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      # Development only: the working tree is mounted so edits are picked up without a
      # rebuild. The production image contains a copy instead.
      - .:/app
      - /app/.venv
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Migrations are not run here, for the reason given in docker/entrypoint.sh: section
    # 22.3 makes applying them a separate, reviewed step. `make up` runs them explicitly
    # once the container is healthy, so the step is visible in the output rather than
    # buried in a container's startup log.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

volumes:
  postgres_data:
